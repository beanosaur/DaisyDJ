<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15110f">
<title>Group Jukebox</title>
<style>
  :root {
    --bg: #15110f; --card: #221b18; --line: #3a2f2a; --text: #f6ece2;
    --muted: #b7a597; --accent: #ff8a3d; --good: #7bd88f; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 18px 40px;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 4px 0 2px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 8px; }
  .now { display: flex; gap: 14px; align-items: center; }
  .disc {
    flex: none; width: 54px; height: 54px; border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0 18%, #111 19% 22%, #2b2b2b 23% 100%);
    box-shadow: inset 0 0 0 2px #000;
  }
  .disc.spin { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-weight: 650; font-size: 19px; }
  .by { color: var(--muted); font-size: 14px; }
  input {
    width: 100%; font: inherit; color: var(--text); background: #120e0c;
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    width: 100%; font: inherit; font-weight: 700; color: #1a0f08; background: var(--accent);
    border: 0; border-radius: 12px; padding: 15px; cursor: pointer;
  }
  button:disabled { opacity: .6; }
  .msg { min-height: 22px; margin-top: 10px; font-size: 15px; }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
  ol { margin: 0; padding-left: 22px; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li span { color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); }
  .offline { color: var(--bad); font-size: 14px; display: none; margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <h1>🎵 Group Jukebox</h1>
  <p class="sub">Add a song and it'll play on the speaker.</p>

  <div class="offline" id="offline">Can't reach the jukebox – are you on the same Wi-Fi?</div>

  <section class="card">
    <div class="label">Now playing</div>
    <div class="now">
      <div class="disc" id="disc"></div>
      <div>
        <div class="title" id="nowTitle">…</div>
        <div class="by" id="nowBy"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="label">Request a song</div>
    <form id="form" autocomplete="off">
      <input id="name" name="name" placeholder="Your name" maxlength="20" required>
      <input id="q" name="q" placeholder="Song and artist, e.g. Hey Ya Outkast" maxlength="100" required>
      <button id="go" type="submit">Add to queue</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </section>

  <section class="card">
    <div class="label">Up next</div>
    <div id="queue" class="empty">Nothing queued yet</div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Remember the guest's name between visits (storage may be unavailable).
  try { $("name").value = localStorage.getItem("jukeboxName") || ""; } catch (e) {}

  async function refresh() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const s = await r.json();
      $("offline").style.display = "none";
      $("nowTitle").textContent = s.nowPlaying || "Waiting for the first request";
      $("nowBy").textContent = s.requestedBy ? "requested by " + s.requestedBy : "";
      $("disc").classList.toggle("spin", !!s.playing);
      $("queue").className = s.upNext.length ? "" : "empty";
      $("queue").innerHTML = s.upNext.length
        ? "<ol>" + s.upNext.map((x) => `<li>${esc(x.query)} <span>· ${esc(x.by)}</span></li>`).join("") + "</ol>"
        : "Nothing queued yet";
    } catch (e) {
      $("offline").style.display = "block";
    }
  }

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = $("name").value.trim(), q = $("q").value.trim();
    if (!name || !q) return;
    try { localStorage.setItem("jukeboxName", name); } catch (e) {}
    $("go").disabled = true;
    const msg = $("msg");
    try {
      const r = await fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ name, q }).toString(),
      });
      const res = await r.json();
      msg.textContent = res.message;
      msg.className = "msg " + (res.ok ? "ok" : "err");
      if (res.ok) $("q").value = "";
    } catch (e) {
      msg.textContent = "Couldn't reach the jukebox.";
      msg.className = "msg err";
    }
    $("go").disabled = false;
    refresh();
  });

  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
